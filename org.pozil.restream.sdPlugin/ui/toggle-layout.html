<!DOCTYPE html>
<html>

<head lang="en">
    <title>Toggle Layout Settings</title>
    <meta charset="utf-8" />
    <script src="https://sdpi-components.dev/releases/v4/sdpi-components.js"></script>
</head>

<body>
    <sdpi-item label="Layout">
        <sdpi-select setting="layoutIndex" default="0" value-type="number">
            <option value="0">Showtime</option>
            <option value="1">Contain</option>
            <option value="2">Cover</option>
            <option value="3">Half Screen</option>
            <option value="4">Picture-in-Picture</option>
            <option value="5">Thumbnails</option>
        </sdpi-select>
    </sdpi-item>
</body>

</html>
