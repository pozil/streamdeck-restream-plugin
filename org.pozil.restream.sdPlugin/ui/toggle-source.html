<!DOCTYPE html>
<html>

<head lang="en">
    <title>Toggle Source Settings</title>
    <meta charset="utf-8" />
    <script src="https://sdpi-components.dev/releases/v4/sdpi-components.js"></script>
</head>

<body>
    <sdpi-item label="Source Index">
        <sdpi-textfield setting="indexString" pattern="\d+" placeholder="Enter a zero-based index" required></sdpi-textfield>
    </sdpi-item>

    <sdpi-item label="Note">
        <sdpi-info>Leave the action title empty so that the plugin automatically displays the source label.</sdpi-info>
    </sdpi-item>
</body>

</html>
